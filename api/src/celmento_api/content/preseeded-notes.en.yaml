  - folder: development
    title: Libraries
    # spec:impl preseeded-notes#list-libraries-digital-libraries
    text: |
      Where to find texts to read. Most of these libraries are in Russian and need a sign-in: your own account or access through a university.

      - [eLibrary](https://www.elibrary.ru/defaultx.asp) — scientific articles and journals on psychology, search by author and keyword, the Russian Science Citation Index.
      - [Koob](https://www.koob.ru/) — free e-books: psychology, coaching, self-development; a handy place to look for the classics.
      - [Urait](https://urait.ru/) — university textbooks and courses: counselling, psychodiagnostics, coaching.
      - [IPR SMART (IPR Books)](https://www.iprbookshop.ru/) — a university e-library: textbooks, monographs and articles on psychology.
      - [Biblioclub](https://biblioclub.ru/) — “University Library Online”: monographs, textbooks and classic texts of psychology.
  - folder: development
    title: Communities and associations
    text: |
      Where to find colleagues, supervision and certification. Requirements are as of September 2026; check the sites for the current terms.

      - [ICF](https://coachingfederation.org/) — International Coaching Federation, for coaches worldwide. Membership: an ICF credential or at least 60 hours of coaching education that meets ICF standards (enrolment counts), annual fee. Credentials: ACC — 60 hours of education and 100 hours of coaching (75 paid, 8 clients); PCC — 125 and 500 hours (450 paid, 25 clients); MCC — 200 and 2,500 hours (2,250 paid, 35 clients). Every level: 10 hours of mentor coaching over at least 3 months and an exam.
      - [FPCM](https://procoach.ru/) — Federation of Professional Coaches and Mentors (Russia, in Russian), for coaches, mentors and those still in training. Membership: an application and an annual fee, no practice hours required. Certification: Coach Practitioner — 60+ hours of education and 100+ hours of practice (80 paid); Coach Expert — 125+ and 500+ hours (450 paid); Coach Master — 250+ and 2,500+ hours (2,300 paid). Every level: 10 hours of mentoring and 5 hours of supervision; renewal takes 3 hours of mentoring and 3 hours of supervision a year.
      - [RPS](https://psyrus.ru/) — Russian Psychological Society (in Russian), for psychologists. Joining goes through a regional branch: an application, a form, two recommendations from current members, a membership fee; no practice or supervision hours required.
      - [b17 forum](https://www.b17.ru/) — the largest Russian-language community of psychologists and a platform for clients: articles, a forum, questions to psychologists. To be listed as a specialist you confirm your psychology education with diploma scans [verify].
  - folder: resource
    title: Affirmations
    # spec:impl preseeded-notes#include-10-15-affirmations-original
    text: |
      Pick the one that speaks to you today.

      - I know how to listen — and that is already help.
      - I don't need to have every answer: a good question goes further than ready advice.
      - I'm responsible for the process; the choice belongs to the person in front of me.
      - Tiredness is a signal to care for myself, not a sign of weakness.
      - Every session starts from a clean page: the last one stays in its own time.
      - I can make mistakes and still be a good specialist.
      - A pause in the conversation is work too.
      - I keep my boundaries so that I have enough strength for those who need it.
      - Today I do as much as I can, and that is enough.
      - A client's trust is a gift I handle with care.
      - My practice grows along with me: not fast, but honestly.
      - I'm allowed to ask for support too: supervision and rest are part of the profession.
