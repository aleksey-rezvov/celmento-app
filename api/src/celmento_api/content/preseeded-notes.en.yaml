notes:
  - folder: null
    title: How to use notes
    # spec:impl preseeded-notes#write-how-use-notes-5-7-short
    text: |
      Notes are the place for everything in text: session records, homework, lists, ideas. Only you can see a note until you tag someone in it.

      1. **Folders.** In the tab's “…” menu choose “New folder”; in a note's menu choose “Move to folder”. Deleting a folder keeps its notes in “All”.
      2. **Checklists.** Turn on a checklist from the bar above the keyboard — for homework, for example. Tapping an item marks it done.
      3. **Tag a client.** Tap “Tag” and pick a client: they will see the note on their side, and only you can edit it. To close access, tap the avatar and choose “Remove access”.
      4. **Reply to a note.** A client answers with a note of their own via “Reply”. The reply shows up for you with the “Shared” label and in the client's card.
      5. **Send as text.** If the client isn't on celmēnto yet, send the note to a messenger: note menu → “Send as text”. Checklist items go as ☐ and ☑ lines.
      6. **These notes are examples.** Edit, move and delete them like your own.
  - folder: practice
    title: Session record
    # spec:impl preseeded-notes#structure-session-protocol-sections
    text: |
      Client, date:

      ## Client's request

      ## Key moments

      ## Insights

      ## Agreements

      ## Homework

      ## My observations

      Only you can see this note. Homework is easier to keep as a separate note with the client tagged in it — then “My observations” stay with you.
  - folder: practice
    title: Ethics codes
    # spec:impl preseeded-notes#write-ethical-codes-links-icf
    text: |
      Links only: the codes belong to the associations and are kept up to date on their sites.

      - [ICF — Code of Ethics](https://coachingfederation.org/ethics/code-of-ethics) — International Coaching Federation; the reference for ICF members and ICF-credentialed coaches.
      - [FPCM — Code of Ethics](https://procoach.ru/docs/) — Federation of Professional Coaches and Mentors (Russia, in Russian); the code is in the “Documents” section.
      - [RPS — Code of Ethics of the Psychologist](https://psyrus.ru/rpo/documentation/ethics.php) — Russian Psychological Society (in Russian); adopted by its 5th congress in 2012.
      - [EMCC — Global Code of Ethics](https://www.globalcodeofethics.org/) — one code for coaches, mentors and supervisors; adopted by EMCC Global (https://www.emccglobal.org/) and eleven other associations.
      - [Association for Coaching](https://www.associationforcoaching.com/) — UK-based coaching association; follows the same Global Code of Ethics, see the Code of Ethics section on its site.
      - [ECF — Coach's Code](https://eurocoach.eu/about-us/kodeks/) — European Coach Federation (site in Russian); the commitments its certified coaches sign up to.

      The links lead to the organizations' own sites; celmēnto is not affiliated with them.
