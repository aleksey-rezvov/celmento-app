notes:
  - folder: null
    title: Как пользоваться заметками
    # spec:impl preseeded-notes#write-how-use-notes-5-7-short
    text: |
      Заметки — место для всего текстового: протоколов сессий, домашних заданий, списков, идей. Заметку видите только вы, пока не отметите в ней человека.

      1. **Папки.** В меню «…» вкладки выберите «Новая папка», в меню заметки — «Переместить в папку». Если удалить папку, её заметки останутся в разделе «Все».
      2. **Чек-листы.** На панели над клавиатурой включите чек-лист — например, для домашнего задания. Нажатие на пункт отмечает его выполненным.
      3. **Отметить клиента.** Нажмите «Отметить» и выберите клиента: он увидит заметку у себя, а менять её сможете только вы. Чтобы закрыть доступ, нажмите на аватар и выберите «Убрать доступ».
      4. **Ответ на заметку.** Клиент отвечает своей заметкой через «Ответить». Ответ появится у вас с меткой «Поделились» и в карточке клиента.
      5. **Отправить текстом.** Если клиент пока не в celmēnto, отправьте заметку в мессенджер: меню заметки → «Отправить текстом». Чек-лист уйдёт строками ☐ и ☑.
      6. **Эти заметки — примеры.** Меняйте, перемещайте и удаляйте их как свои.
  - folder: practice
    title: Протокол сессии
    # spec:impl preseeded-notes#structure-session-protocol-sections
    text: |
      Клиент, дата:

      ## Запрос клиента

      ## Ключевые моменты

      ## Инсайты

      ## Договорённости

      ## Домашнее задание

      ## Мои наблюдения

      Заметку видите только вы. Домашнее задание удобно вынести в отдельную заметку и отметить в ней клиента — тогда «Мои наблюдения» останутся при вас.
  - folder: practice
    title: Этические кодексы
    # spec:impl preseeded-notes#write-ethical-codes-links-icf
    text: |
      Только ссылки: тексты кодексов принадлежат ассоциациям и обновляются на их сайтах.

      - [ICF — Кодекс этики](https://coachingfederation.org/ethics/code-of-ethics) — Международная федерация коучинга; ориентир для членов ICF и коучей с её сертификацией.
      - [ФПКиН — Этический кодекс](https://procoach.ru/docs/) — Федерация профессиональных коучей и наставников (Россия); кодекс лежит в разделе «Документы».
      - [РПО — Этический кодекс психолога](https://psyrus.ru/rpo/documentation/ethics.php) — Российское психологическое общество; принят V съездом РПО в 2012 году.
      - [EMCC — Global Code of Ethics](https://www.globalcodeofethics.org/) — единый кодекс для коучей, менторов и супервизоров; принят EMCC Global (https://www.emccglobal.org/) и ещё одиннадцатью ассоциациями.
      - [Association for Coaching](https://www.associationforcoaching.com/) — британская ассоциация коучей; работает по тому же Global Code of Ethics, на сайте — раздел Code of Ethics.
      - [ECF — Кодекс коуча](https://eurocoach.eu/about-us/kodeks/) — European Coach Federation; обязательства, которые принимают сертифицированные коучи ECF.

      Ссылки ведут на сайты организаций; celmēnto с ними не связан.
  - folder: development
    title: Книги и фильмы
    # spec:impl preseeded-notes#make-books-films-checklist-7-titles
    text: |
      Прочитано и просмотрено — отмечайте галочкой. Список пополняйте своими находками.

      - [x] Джон Уитмор «Коучинг высокой эффективности»
      - [x] Ирвин Ялом «Дар психотерапии»
      - [ ] Нэнси Мак-Вильямс «Психоаналитическая диагностика»
      - [ ] Карл Роджерс «Взгляд на психотерапию. Становление человека»
      - [ ] Виктор Франкл «Сказать жизни «Да!»»
      - [ ] Фильм «Умница Уилл Хантинг»
      - [ ] Фильм «Король говорит!»
  - folder: development
    title: Библиотеки
    # spec:impl preseeded-notes#list-libraries-digital-libraries
    text: |
      Где брать тексты для чтения. У большинства библиотек нужен вход: свой аккаунт или доступ через вуз.

      - [eLibrary](https://www.elibrary.ru/defaultx.asp) — научные статьи и журналы по психологии, поиск по авторам и ключевым словам, РИНЦ.
      - [Koob](https://www.koob.ru/) — бесплатные электронные книги: психология, коучинг, саморазвитие; удобно искать классику.
      - [Юрайт](https://urait.ru/) — учебники и курсы вузов: психологическое консультирование, психодиагностика, коучинг.
      - [IPR SMART (IPR Books)](https://www.iprbookshop.ru/) — вузовская электронная библиотека: учебники, монографии и статьи по психологии.
      - [Biblioclub](https://biblioclub.ru/) — «Университетская библиотека онлайн»: монографии, учебники, классические тексты психологии.
  - folder: development
    title: Сообщества и ассоциации
    text: |
      Где искать коллег, супервизию и сертификацию. Требования указаны на сентябрь 2026 года; актуальные условия — на сайтах.

      - [ICF](https://coachingfederation.org/) — Международная федерация коучинга, для коучей по всему миру. Членство: сертификат ICF или не менее 60 часов обучения коучингу по стандартам ICF (можно в процессе обучения), ежегодный взнос. Сертификация: ACC — 60 часов обучения и 100 часов практики (75 оплаченных, 8 клиентов); PCC — 125 и 500 часов (450 оплаченных, 25 клиентов); MCC — 200 и 2 500 часов (2 250 оплаченных, 35 клиентов). На любом уровне — 10 часов менторинга не меньше чем за 3 месяца и экзамен.
      - [ФПКиН](https://procoach.ru/) — Федерация профессиональных коучей и наставников (Россия), для коучей, менторов и наставников, в том числе ещё обучающихся. Членство: заявление и ежегодный взнос, часы практики не требуются. Сертификация: Коуч Практик — 60+ часов обучения и 100+ часов практики (80 оплаченных); Коуч Эксперт — 125+ и 500+ часов (450 оплаченных); Коуч Мастер — 250+ и 2 500+ часов (2 300 оплаченных). На каждом уровне — 10 часов менторинга и 5 часов супервизии, для продления — по 3 часа менторинга и супервизии в год.
      - [РПО](https://psyrus.ru/) — Российское психологическое общество, для психологов. Вступление через региональное отделение: заявление, анкета, две рекомендации действующих членов РПО, членский взнос; часы практики и супервизии не требуются.
      - [Форум b17](https://www.b17.ru/) — крупнейшее сообщество психологов и площадка для клиентов: статьи, форум, вопросы психологам. Чтобы разместиться как специалист, нужно подтвердить психологическое образование сканами дипломов [проверить].
  - folder: resource
    title: Аффирмации
    # spec:impl preseeded-notes#include-10-15-affirmations-original
    text: |
      Выбирайте ту, что откликается сегодня.

      - Я умею слушать — и это уже помощь.
      - Мне не нужно знать все ответы: хороший вопрос ведёт дальше готового совета.
      - Я отвечаю за процесс, а выбор остаётся за человеком напротив.
      - Усталость — сигнал позаботиться о себе, а не признак слабости.
      - Каждая встреча начинается с чистого листа: прошлая сессия остаётся в своём времени.
      - Я могу ошибаться и оставаться хорошим специалистом.
      - Пауза в разговоре — тоже работа.
      - Я держу границы, чтобы сил хватало на тех, кому они нужны.
      - Сегодня я делаю столько, сколько могу, и этого достаточно.
      - Доверие клиента — подарок, с которым я обращаюсь бережно.
      - Моя практика растёт вместе со мной: не быстро, зато честно.
      - Мне тоже можно просить о поддержке: супервизия и отдых — часть профессии.
