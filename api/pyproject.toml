[project]
name = "celmento-api"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "email-validator==2.4.0",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "pyyaml==6.0.4",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py315"
